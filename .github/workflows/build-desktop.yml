name: Build Desktop (Windows)

# Builds a Windows .exe installer on every push and publishes it to the
# "latest" release for a stable download link.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write Google OAuth config (secret injected here, not in repo)
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | tr -d '[:space:]')"
          cat > electron/google-config.js <<EOF
          module.exports = {
            clientId: '900136320125-3t5upmp3hgrkiq737n5r49g895ee6rdu.apps.googleusercontent.com',
            clientSecret: '${GOOGLE_CLIENT_SECRET}'
          }
          EOF
          echo "::notice::clientSecretLen=${#GOOGLE_CLIENT_SECRET} (expected 35)"

      - name: Install dependencies
        run: npm install

      - name: Build renderer (Vite)
        run: npm run build

      - name: Package Windows installer (electron-builder)
        shell: bash
        run: |
          set +e
          npx electron-builder --win --publish never 2>&1 | tee eb.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -iE "error|cannot|fail|exception|not found|ENOENT|signtool|nsis|icon" eb.log | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: photostat-master-setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish to "latest" Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Photostat Master Desktop — latest
          body: Windows installer. Run the .exe to install Photostat Master.
          files: release/*.exe
